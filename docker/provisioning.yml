# Dependencies of both modules, installed at first startup.
# The jahia-strava (Java) and jahia-strava-js (tgz) modules themselves are deployed
# from their respective builds: `mvn clean install` and `cd javascript && yarn deploy`.
- installOrUpgradeModule:
    - 'mvn:org.jahia.modules/javascript-modules-engine/1.3.1'
    - 'mvn:org.jahia.modules/jahia-authentication/2.0.0'
    - 'mvn:org.jahia.modules/jahia-oauth/5.0.0'
    - 'mvn:org.jahiacommunity.modules/jahia-oauth-oidc/2.0.2'
